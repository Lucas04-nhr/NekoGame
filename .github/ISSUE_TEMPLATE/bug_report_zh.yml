name: Bug 报告
description: 报告一个 Bug 以帮助我们改进
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您抽出时间填写这个 Bug 报告！

  - type: textarea
    id: description
    attributes:
      label: 描述
      description: 清晰简洁地描述 Bug 是什么。
      placeholder: 告诉我们发生了什么
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 重现步骤
      description: 重现该问题的步骤
      placeholder: |
        1. 转到 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 清晰简洁地描述你期望发生的事情。
      placeholder: 告诉我们应该发生什么
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果适用，请添加截图以帮助解释您的问题。
      placeholder: 在此处拖放或粘贴截图
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 您使用的是什么操作系统？
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器
      description: 您使用的是什么浏览器？
      placeholder: 例如，Chrome 114, Firefox 115, Safari 16
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 版本
      description: 您使用的应用程序版本是什么？
      placeholder: 例如，1.0.0
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 其他上下文
      description: 在此处添加有关问题的任何其他上下文。
      placeholder: 任何可能有帮助的其他信息
    validations:
      required: false
